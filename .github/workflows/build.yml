name: Build data.json

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Merge src files into data.json
        run: node build.js
      - name: Commit generated files
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data.json version.json
          git diff --cached --quiet || git commit -m "auto: rebuild data.json"
          git push
